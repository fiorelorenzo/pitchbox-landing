<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Icons, copied from the app's own static set so the two hosts share one mark.
		     Without them every page load ends in a 404 for the browser's default
		     /favicon.ico request, which is how this shipped the first time. -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon-32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- hooks.server.ts rewrites the html tag's lang attribute per request to match the
		     URL locale (/ -> en, /it -> it); see src/hooks.server.ts. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
